# MySQL para desenvolvimento local.
#   Subir:   docker compose up -d
#   Parar:   docker compose down        (mantém os dados)
#   Zerar:   docker compose down -v     (apaga o volume → banco recriado e re-populado na próxima execução da API)
services:
  mysql:
    image: mysql:8.4 # 8.4 é a versão LTS atual do MySQL
    container_name: miodolce-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: miodolce
      MYSQL_USER: miodolce
      MYSQL_PASSWORD: miodolce_dev
      MYSQL_ROOT_PASSWORD: root_dev
      TZ: UTC
    ports:
      # 3307 no host para não colidir com um MySQL instalado localmente (que costuma usar a 3306).
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
